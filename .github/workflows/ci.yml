name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pbix-parser
        run: pip install -e packages/pbix-parser
      - name: Run tests
        run: cd packages/pbix-parser && python -m pytest -v

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install deps
        run: |
          cd packages/pbix-web-app
          npm install -g pnpm
          pnpm install
      - name: Build
        run: cd packages/pbix-web-app && pnpm build
