[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbix-validator"
version = "0.1.0"
description = "Validate PBIX web app rendering via screenshots and text comparison"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "pillow>=10",
    "pydantic>=2",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pbix-validator = "pbix_validator.cli:app"
